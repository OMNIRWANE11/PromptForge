<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#090d18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#02040a" stop-opacity="1" />
    </radialGradient>

    <!-- Monitor Blue Gradient -->
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Screen Bezel Highlight -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Subtle Wave Stroke Clip -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248" />
    </clipPath>
  </defs>

  <!-- Circular Outer Badge -->
  <g clip-path="url(#circleClip)">
    <circle cx="256" cy="256" r="256" fill="url(#bgGlow)" />
    
    <!-- Background Texture Wave Lines -->
    <path d="M -50 120 Q 150 70 300 130 T 600 110" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.35" />
    <path d="M -50 180 Q 120 140 280 190 T 600 170" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.35" />
    <path d="M -50 240 Q 140 200 320 250 T 600 230" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.35" />
    <path d="M -50 300 Q 160 270 310 320 T 600 290" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.35" />
    <path d="M -50 360 Q 130 330 330 380 T 600 350" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.35" />
  </g>

  <!-- Outer Ring Border -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.75" />
  <circle cx="256" cy="256" r="244" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.4" />

  <!-- Monitor Stand Base & Neck -->
  <g id="monitorStand">
    <!-- Curved Base -->
    <path d="M 195 304 C 215 292 297 292 317 304 C 300 307 212 307 195 304 Z" fill="url(#monitorGrad)" />
    <!-- Stand Neck -->
    <polygon points="238,266 274,266 284,296 228,296" fill="url(#monitorGrad)" />
  </g>

  <!-- Monitor Frame -->
  <g id="monitor">
    <!-- Monitor Outer Body -->
    <rect x="146" y="120" width="220" height="152" rx="16" fill="url(#monitorGrad)" />
    
    <!-- Monitor Screen Inner Display (Dark Slate Well) -->
    <rect x="156" y="130" width="200" height="110" rx="9" fill="#040711" stroke="#1e293b" stroke-width="1" />
    
    <!-- Bottom Bezel Speaker / Camera Slot -->
    <rect x="234" y="248" width="44" height="6" rx="3" fill="#0b1329" stroke="#60a5fa" stroke-width="1" opacity="0.8" />
  </g>

  <!-- Screen Content: "PF" & Microchip + Gear -->
  <!-- "PF" Text Mark on Left of Screen -->
  <text x="172" y="174" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">PF</text>

  <!-- Chip Icon with Gear on Right of Screen -->
  <g transform="translate(306, 175) scale(0.92)" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chip Center Body -->
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#091224" stroke="#ffffff" stroke-width="2.2" />
    
    <!-- Center Gear Cogwheel -->
    <circle cx="0" cy="0" r="4.5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.8" />
    <!-- Cog teeth -->
    <line x1="0" y1="-7.5" x2="0" y2="-5.5" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="5.5" x2="0" y2="7.5" stroke="#ffffff" stroke-width="2" />
    <line x1="-7.5" y1="0" x2="-5.5" y2="0" stroke="#ffffff" stroke-width="2" />
    <line x1="5.5" y1="0" x2="7.5" y2="0" stroke="#ffffff" stroke-width="2" />

    <!-- Top pins -->
    <line x1="-8" y1="-16" x2="-8" y2="-24" />
    <circle cx="-8" cy="-25" r="1.5" fill="#ffffff" stroke="none" />
    <line x1="8" y1="-16" x2="8" y2="-24" />
    <circle cx="8" cy="-25" r="1.5" fill="#ffffff" stroke="none" />

    <!-- Bottom pins -->
    <line x1="-8" y1="16" x2="-8" y2="24" />
    <circle cx="-8" cy="-25" r="1.5" fill="#ffffff" stroke="none" />
    <line x1="8" y1="16" x2="8" y2="24" />
    <circle cx="8" cy="25" r="1.5" fill="#ffffff" stroke="none" />

    <!-- Left pins -->
    <line x1="-16" y1="-8" x2="-24" y2="-8" />
    <circle cx="-25" cy="-8" r="1.5" fill="#ffffff" stroke="none" />
    <line x1="-16" y1="8" x2="-24" y2="8" />
    <circle cx="-25" cy="8" r="1.5" fill="#ffffff" stroke="none" />

    <!-- Right pins -->
    <line x1="16" y1="-8" x2="24" y2="-8" />
    <circle cx="25" cy="-8" r="1.5" fill="#ffffff" stroke="none" />
    <line x1="16" y1="8" x2="24" y2="8" />
    <circle cx="25" cy="8" r="1.5" fill="#ffffff" stroke="none" />
  </g>

  <!-- Typography: PROMPT FORGE -->
  <g transform="translate(256, 362)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text font-size="34" font-weight="900" letter-spacing="1.5">
      <tspan fill="#3b82f6">PROMPT </tspan>
      <tspan fill="#ffffff">FORGE</tspan>
    </text>
  </g>

  <!-- Tagline: OPTIMIZE. MINIMIZE. MAXIMIZE -->
  <text x="256" y="394" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="4.5">
    OPTIMIZE. MINIMIZE. MAXIMIZE
  </text>
</svg>